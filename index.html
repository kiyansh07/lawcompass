<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LawCompass</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>LawCompass</h1>
</header>

<!-- LOGIN -->
<section id="loginPage">
<h2>Student Login</h2>
<input type="text" id="name" placeholder="Full Name">
<input type="text" id="studentId" placeholder="Student ID">
<button onclick="login()">Continue</button>
</section>

<!-- INSTRUCTIONS -->
<section id="instructionsPage" class="hidden">
<h2>Test Instructions</h2>
<ul>
<li>Attempt only once</li>
<li>50 students max</li>
<li>Timer will auto submit</li>
</ul>
<button onclick="goToPassword()">Proceed</button>
</section>

<!-- PASSWORD -->
<section id="passwordPage" class="hidden">
<h2>Enter Test Password</h2>
<input type="password" id="testPassword" placeholder="4 digit password">
<button onclick="verifyPassword()">Start Test</button>
</section>

<!-- EXAM -->
<section id="examPage" class="hidden">
<div id="timer"></div>

<div id="questionContainer"></div>

<div id="navigator"></div>

<button onclick="prevQuestion()">Previous</button>
<button onclick="nextQuestion()">Next</button>
<button onclick="submitTest()">Submit Test</button>
</section>

<!-- RESULT -->
<section id="resultPage" class="hidden">
<h2>Your Result</h2>
<div id="scoreDisplay"></div>
<div id="rankDisplay"></div>
<button onclick="loadLeaderboard()">View Leaderboard</button>
</section>

<!-- LEADERBOARD -->
<section id="leaderboardPage" class="hidden">
<h2>Leaderboard</h2>
<div id="top10"></div>

<input type="text" id="searchBox" placeholder="Search name or ID">
<button onclick="searchRank()">Search</button>

<div id="searchResult"></div>
</section>

<script src="firebase.js"></script>
<script src="questions.js"></script>
<script src="app.js"></script>

</body>
</html>
